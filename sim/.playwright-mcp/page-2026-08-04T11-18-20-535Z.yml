- generic [active] [ref=f17e1]:
  - heading "Roster card — H2 header, three TEAM views" [level=1] [ref=f17e2]
  - paragraph [ref=f17e3]: "All three cards are POC 2 with the H2 header, at the true compact size (316×232). Points and open-slot count have left the header — it now carries money only: dollars left, max bid, and the burn bar. Both figures reappear, with room to be labeled, in the third pane, which is no longer NEED but TEAM. Click the segments; the three sections below differ only in what TEAM looks like."
  - heading "T1 — stat tiles over position meters · the direct translation" [level=2] [ref=f17e4]
  - paragraph [ref=f17e5]: Three labeled tiles — STARTERS points, BENCH points, OPEN slots — then the position meters as they were. Nothing to learn and nothing lost from the old NEED view; it just gained the team totals the header gave up. Densest of the three, and the only one where every position keeps its fill bar.
