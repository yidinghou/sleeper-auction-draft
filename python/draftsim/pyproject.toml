[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "draftsim"
version = "0.1.0"
description = "A fantasy football auction draft as an append-only ledger of picks"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["draftsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
