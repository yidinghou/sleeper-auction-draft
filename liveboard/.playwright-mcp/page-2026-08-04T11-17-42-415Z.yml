  - heading "T3 — slot ledger · not how many are open, which" [level=2] [ref=f16e311]
  - paragraph [ref=f16e312]: Totals on one line, then the actual open slots as chips — DEF, K, and however many bench bodies. "12 open" never told you whether a seat can still take the receiver on the block; WR · FLEX · W/T does. Leanest and most legible of the three; it drops the have/want detail, so it answers "can they bid on this player" rather than "how short are they at receiver".
