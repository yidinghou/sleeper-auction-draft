  - heading "T2 — points split, dense position grid · where the points sit" [level=2] [ref=f16e171]
  - paragraph [ref=f16e172]: "Starters and bench become one proportional bar instead of two figures: a seat carrying a third of its points on the bench has drafted badly, and the proportion says that faster than any pair of numbers. Positions drop their meters and pack two to a row, which buys the space for the bar and keeps the whole pane on one screen."
