  - heading "POC C — needs strip, bench collapsed · the hybrid" [level=2] [ref=f10e349]
  - paragraph [ref=f10e350]: A one-line position strip on top (colored = still short, grey = done), then the lineup, then the bench folded behind a summary line you can open in place. Answers "what do they still need" and "who is starting" at rest, and keeps depth reachable. The cost is a third interaction on a card that already drags and flips.
