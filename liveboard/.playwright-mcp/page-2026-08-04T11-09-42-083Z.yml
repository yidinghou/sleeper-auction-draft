  - heading "Roster card — POC 2, and three headers for it" [level=1] [ref=f12e2]
  - paragraph [ref=f12e3]: "Every card below is POC 2: one player per line, three panes (LINEUP / BN / NEED), nothing scrolls. Shown at the true compact size (316×232 — one twelfth of the board), with three seats: yours mid-draft, a seat that is nearly out of money, and one that has barely started. Click the segments — the bench pane is what changed first."
  - heading "Bench, with position markers · click BN on any card" [level=2] [ref=f12e4]
  - paragraph [ref=f12e5]: Bench rows used to blank the slot chip, which was fine when they sat under the lineup and inherited its context. In a pane of their own they had nothing saying what the players were. Now each bench row carries the player's real position, outlined instead of filled so the pane still reads as depth rather than a second lineup.
