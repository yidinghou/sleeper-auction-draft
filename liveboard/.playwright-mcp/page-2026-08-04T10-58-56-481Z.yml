- generic [active] [ref=f11e1]:
  - heading "Roster card — three less-cluttered POCs" [level=1] [ref=f11e2]
  - paragraph [ref=f11e3]: Same seat, same moment of the draft, at the real compact card size (316×232 — one twelfth of the board). All three drop the two-up pairing for one player per line; they differ in what they do about the bench.
  - heading "POC A — one column, scroll · nothing hidden, nothing toggled" [level=2] [ref=f11e4]
  - paragraph [ref=f11e5]: Starters run straight down, a sticky BENCH rule divides, the card scrolls past it. No modes to be in and no state to remember — the cost is that the bottom of the lineup is below the fold on every card, so "does seat 4 have a tight end?" is a scroll, not a glance.
