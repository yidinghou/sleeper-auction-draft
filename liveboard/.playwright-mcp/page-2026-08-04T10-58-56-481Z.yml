  - heading "POC B — starters / bench / needs toggle · three panes, no scroll" [level=2] [ref=f11e184]
  - paragraph [ref=f11e185]: The header carries a segmented control; exactly one pane shows and each fits the card whole. Every starter is visible at rest — the common question is answered without scrolling or clicking. The cost is that the bench is a click away and each card remembers its own mode, so a board can end up in twelve different states.
