  - paragraph [ref=f14e278]: "Dollars left in large type with a spend bar under it: gold is what is left, grey is what is already committed to unfilled slots, dark is spent. Twelve cards rank themselves down the board without reading a figure. Points shrink to a supporting number — this header assumes the question at the podium is \"who can outbid me\", not \"who is winning\"."
